<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit EOD - Live ERP</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --bg: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.1);
        --input-bg: rgba(15, 23, 42, 0.5);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: var(--bg);
        background-image:
          radial-gradient(
            circle at 20% 20%,
            rgba(99, 102, 241, 0.15) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(168, 85, 247, 0.15) 0%,
            transparent 40%
          );
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 2rem 1rem;
      }

      .container {
        width: 100%;
        max-width: 600px;
        margin: auto;
        animation: fadeIn 0.6s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        padding: 2.5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        position: relative;
      }

      .logout-link {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.75rem;
        font-weight: 500;
        transition: color 0.2s;
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }

      .logout-link:hover {
        color: #ef4444;
      }

      .header {
        margin-bottom: 2rem;
        text-align: center;
      }

      .header h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        background: linear-gradient(to right, #818cf8, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header p {
        color: var(--text-muted);
        font-size: 0.875rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--text-muted);
      }

      input,
      textarea,
      select {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        color: var(--text);
        font-size: 1rem;
        transition: all 0.2s;
        outline: none;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .btn-submit {
        width: 100%;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 0.75rem;
        padding: 1rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-submit:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
      }

      .btn-submit:active {
        transform: translateY(0);
      }

      .btn-submit:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .loader {
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.8s linear infinite;
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        padding: 1rem 1.5rem;
        border-radius: 0.75rem;
        background: #10b981;
        color: white;
        font-weight: 500;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        transform: translateY(100px);
        transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        z-index: 100;
      }

      .toast.error {
        background: #ef4444;
      }

      .toast.show {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <a href="/logout" class="logout-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Logout
        </a>
        <div class="header">
          <h1>Sachin's Submit EOD</h1>
          <p>Fill in your daily progress and updates</p>
        </div>
        <form id="eodForm">
          <div class="form-group">
            <label for="employee_name">Employee Name</label>
            <input
              type="text"
              id="employee_name"
              name="employee_name"
              list="employee_list"
              placeholder="Search or select your name..."
              required
            />
            <datalist id="employee_list"></datalist>
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required />
          </div>
          <div class="form-group">
            <label for="project_name">Project</label>
            <select id="project_name" name="project_name">
              <option value="">Select a project...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <textarea
              id="description"
              name="description"
              placeholder="What did you achieve today?"
              required
            ></textarea>
          </div>
          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="loader" id="btnLoader"></span>
            <span id="btnText">Submit EOD Report</span>
          </button>
        </form>
      </div>
    </div>

    <div id="toast" class="toast">EOD Submitted Successfully!</div>

    <script>
      // Set default date to today
      document.getElementById("date").valueAsDate = new Date();

      // Fetch projects
      async function fetchProjects() {
        try {
          const response = await fetch("/projects");
          const projects = await response.json();
          const select = document.getElementById("project_name");
          projects.forEach((project) => {
            const option = document.createElement("option");
            option.value = project;
            option.textContent = project;
            select.appendChild(option);
          });
        } catch (error) {
          console.error("Error fetching projects:", error);
        }
      }

      fetchProjects();

      // Fetch employees
      async function fetchEmployees() {
        try {
          const response = await fetch("/employees");
          const employees = await response.json();
          const datalist = document.getElementById("employee_list");
          const input = document.getElementById("employee_name");

          datalist.innerHTML = ""; // Clear any existing options

          employees.forEach((emp) => {
            const trimmedName = emp.trim();
            const option = document.createElement("option");
            option.value = trimmedName;
            datalist.appendChild(option);

            // Priority auto-select for Sachin Yadav
            if (trimmedName.toLowerCase().includes("sachin")) {
              input.value = trimmedName;
            }
          });
        } catch (error) {
          console.error("Error fetching employees:", error);
        }
      }

      fetchEmployees();

      // Form submission
      const form = document.getElementById("eodForm");
      const submitBtn = document.getElementById("submitBtn");
      const btnLoader = document.getElementById("btnLoader");
      const btnText = document.getElementById("btnText");
      const toast = document.getElementById("toast");

      function showToast(message, isError = false) {
        toast.textContent = message;
        toast.className = "toast" + (isError ? " error" : "") + " show";
        setTimeout(() => {
          toast.classList.remove("show");
        }, 3000);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);
        const data = {
          employee_name: formData.get("employee_name"),
          date: formData.get("date"),
          description: formData.get("description"),
          project_name: formData.get("project_name") || null,
        };

        // UI Loading state
        submitBtn.disabled = true;
        btnLoader.style.display = "block";
        btnText.textContent = "Submitting...";

        try {
          const response = await fetch("/submit-eod", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          const result = await response.json();

          if (response.ok) {
            showToast("EOD Report submitted successfully!");
            form.reset();
            document.getElementById("date").valueAsDate = new Date();
            fetchEmployees(); // Refetch to reset default
          } else {
            showToast(result.detail || "Failed to submit EOD", true);
          }
        } catch (error) {
          showToast("Network error occurred", true);
        } finally {
          submitBtn.disabled = false;
          btnLoader.style.display = "none";
          btnText.textContent = "Submit EOD Report";
        }
      });
    </script>
  </body>
</html>
